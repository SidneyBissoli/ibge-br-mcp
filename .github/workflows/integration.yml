name: Integration tests (live IBGE APIs)

# Valida o CONTRATO DO CATÁLOGO contra a API real de agregados: cada código
# de tabela SIDRA declarado nos catálogos do servidor precisa apontar para a
# tabela que o rótulo promete (tests/catalog-contract.integration.test.ts).
#
# História que motivou este workflow: em 2026-08 o monitor do portfólio
# descobriu que ~13 códigos estavam errados desde o commit inicial — a API
# responde 200 com dados válidos de OUTRA tabela, então nenhum teste offline
# pega esse erro. Roda em cron (não gateia PRs) para também capturar o dia em
# que o IBGE aposentar/substituir uma tabela.

on:
  # segunda 08:00 UTC = 05:00 BRT, antes da rodada semanal do monitor (09:00 BRT)
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Teto de parede. O alvo de um destes contratos pode parar de responder
    # sem fechar a conexão — descarte silencioso em firewall, medido no
    # senado-br-mcp em 12/09/2026 — e aí cada requisição só morre no timeout
    # dela, o job nunca falha sozinho e vai até as 6 h padrão do GitHub.
    # Rodada real aqui leva no máximo ~2,5 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Catalog contract against live IBGE API
        env:
          INTEGRATION_TESTS: '1'
        run: npx vitest run tests/catalog-contract.integration.test.ts

      # Mesma classe de defeito, outra API: a URL que a ferramenta MONTA só é
      # validada por quem a recebe. O ibge_malhas mandava o vocabulário da v2
      # (`qualidade=1..4`) para a v3 e falhava 100% das vezes desde sempre, com
      # os testes offline verdes — eles mockam o fetch e conferem o caminho.
      - name: Malhas contract against live IBGE API
        env:
          INTEGRATION_TESTS: '1'
        run: npx vitest run tests/malhas-contract.integration.test.ts

      # Recortes temáticos: outro SERVIÇO (o WFS do Geosserviços), e o nome da
      # camada só vale enquanto o IBGE a publicar. A ferramenta anunciava sete
      # temas contra a API de malhas, que nunca teve nenhum.
      - name: Malhas temáticas contract against live IBGE WFS
        env:
          INTEGRATION_TESTS: '1'
        run: npx vitest run tests/malhas-tema-contract.integration.test.ts

      # Resultado VAZIO do SIDRA: a lacuna de período é da fonte, e o teste
      # pergunta a ela qual é em vez de pinar um ano — 2023 pode ser preenchido.
      - name: SIDRA empty-result diagnosis against live IBGE API
        env:
          INTEGRATION_TESTS: '1'
        run: npx vitest run tests/sidra-vazio.integration.test.ts
