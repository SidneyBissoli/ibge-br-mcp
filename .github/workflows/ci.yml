name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Floor is node >= 20 (package engines, MCP SDK v2 requirement).
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Falha se a cobertura cair abaixo do piso de vitest.config.ts — é este
      # passo que impede o número do README de virar ficção.
      - name: Run tests with coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # SEM continue-on-error: com ele o passo nunca reprovava nada, e cinco
      # advisories high ficaram meses no repositório sem ninguém notar — foi o
      # que derrubou a nota do MseeP para 2,7 ("Moderate Risk", scan 13/08/2026),
      # embora todas fossem transitivas do eslint e `npm audit --omit=dev` desse
      # zero. Diretório de MCP pontua a superfície do audit, não só o runtime.
      - name: Run npm audit
        run: npm audit --audit-level=high
