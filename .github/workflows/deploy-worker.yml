name: Deploy to Cloudflare Workers

# POR QUE ESTE WORKFLOW EXISTE
#
# O deploy do worker era manual, e a deriva que isso produz foi MEDIDA aqui em
# 29/08/2026: o npm estava em 4.0.2 e o endpoint hospedado em 4.0.1. A causa é
# estrutural, não descuido — `worker/src/*.ts` importa de `../../dist/server.js`,
# então `wrangler deploy` rodado direto de dentro de `worker/` publica o `dist/`
# que estiver no disco. Sem `npm run build` na raiz antes, sobe código velho e
# nada avisa: o endpoint responde 200 servindo a versão anterior.
#
# É a mesma lição que o bcb-br-mcp já tinha aprendido (npm 1.3.5 × hospedado
# 1.3.1, com descrições de tool de ~100 caracteres em produção onde o fonte já
# tinha ~1.200). Este arquivo é a instância dela aqui.
#
# Dois gatilhos:
# - push em main (nos caminhos que afetam o worker): mantém o endpoint em
#   lockstep com o pacote publicado;
# - workflow_dispatch: redeploy manual sem mudança de código.
#
# Secrets necessários no GitHub (ainda NÃO cadastrados neste repositório — o
# job se pula sozinho enquanto faltarem):
#   CLOUDFLARE_API_TOKEN  — token com permissão "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID — conta em que o worker é publicado

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "surface.lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Enquanto o CLOUDFLARE_API_TOKEN não estiver cadastrado nos secrets do
      # repositório, o deploy é PULADO em vez de falhar: um main vermelho por
      # credencial ausente esconde falhas de verdade. O deploy segue possível
      # manualmente (`npm run build` na raiz e depois `npx wrangler deploy`
      # dentro de worker/, com login local) — nessa ordem, sempre.
      - name: Verificar credencial da Cloudflare
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_API_TOKEN ausente — deploy pulado. Cadastre o secret para ligar o deploy contínuo."
          fi

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "npm"

      # A RAIZ VEM PRIMEIRO, e não é ordem arbitrária: o worker importa
      # `../../dist/server.js` e resolve o SDK do node_modules da raiz (cópia
      # única). Pular este passo é exatamente como se produz a deriva acima.
      - if: steps.cf.outputs.ok == 'true'
        name: Install + typecheck + build (raiz)
        run: |
          npm ci
          npm run typecheck
          npm run build

      # O DEPLOY SE RECUSA A RODAR COM TESTE VERMELHO. Até 02/10/2026 este job
      # só checava tipos: o push no main publicava mesmo com a suíte quebrada.
      # Entre os testes está a trava da superfície declarada
      # (tests/surface-lock.test.ts): mudou sem subir a versão = vermelho aqui,
      # e o wrangler abaixo não roda.
      - if: steps.cf.outputs.ok == 'true'
        name: Testes (raiz) — inclui a trava da superfície declarada
        run: npm test

      - if: steps.cf.outputs.ok == 'true'
        name: Install (worker)
        run: npm ci
        working-directory: worker

      - if: steps.cf.outputs.ok == 'true'
        name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      # A outra metade da trava (worker/tests/surface-lock.test.ts): o servidor
      # que o Worker monta à parte serve a superfície travada, e quais métodos
      # respondem sem token — comportamento que nenhuma listagem mostra.
      - if: steps.cf.outputs.ok == 'true'
        name: Testes (worker) — inclui a trava de quem responde sem token
        run: npm test
        working-directory: worker

      - if: steps.cf.outputs.ok == 'true'
        name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      # A GUARDA QUE O SMOKE NÃO DÁ. O smoke abaixo exercita a superfície, mas
      # passaria IGUAL servindo a versão anterior — que é justamente a deriva
      # que este workflow existe para impedir, e que aconteceu de novo no
      # senado-br-mcp-cloudflare (npm 3.5.1, hospedado 3.5.0 por cinco dias,
      # medido em 29/08/2026). Comparar o que /status reporta com o
      # package.json torna a deriva vermelha em vez de silenciosa.
      - if: steps.cf.outputs.ok == 'true'
        name: Versão hospedada bate com o package.json
        run: |
          # Repete por até 3 min (06/10/2026). Uma leitura única após `sleep 20` dava
          # vermelho falso quando o Worker novo demorava a chegar à borda — e o falso
          # vermelho PULAVA o smoke e a conferência da superfície (medido no senado,
          # run 37515023242). /status responde `no-store`: o atraso é propagação.
          ESPERADA=$(node -p "require('./package.json').version")
          PRAZO=180; INTERVALO=10; INICIO=$(date +%s); NO_AR="?"
          while :; do
            # Falha de rede ou JSON inválido não derruba o laço: vira "?" e tenta de novo.
            NO_AR=$(curl -sS --max-time 30 https://ibge.sidneybissoli.com/status 2>/dev/null \
              | node -e "try{console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).version)}catch{console.log('?')}" \
              || echo "?")
            DECORRIDO=$(( $(date +%s) - INICIO ))
            echo "t=${DECORRIDO}s  package.json=$ESPERADA  hospedado=$NO_AR"
            [ "$ESPERADA" = "$NO_AR" ] && exit 0
            if [ "$DECORRIDO" -ge "$PRAZO" ]; then
              echo "::error::deriva: após ${PRAZO}s o endpoint serve $NO_AR e o repositório está em $ESPERADA"
              exit 1
            fi
            sleep "$INTERVALO"
          done

      # Fecha o ciclo: se o deploy subir um worker quebrado, o job falha aqui e
      # não em silêncio na próxima vez que alguém abrir o endpoint.
      - if: steps.cf.outputs.ok == 'true'
        name: Smoke em produção
        run: node scripts/smoke-mcp.mjs

      # O que subiu é o que foi travado: superfície declarada servida sem
      # credencial e, método a método, quem responde sem token (produção =
      # API_KEY ausente). Os testes provam o CÓDIGO; isto prova o ENDPOINT.
      - if: steps.cf.outputs.ok == 'true'
        name: Superfície no ar = surface.lock.json
        run: npx mcp-surface verificar https://ibge.sidneybissoli.com/mcp --tool ibge_indicadores --args '{"indicador":"listar"}'
